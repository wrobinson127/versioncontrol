name: nightly

on:
  schedule:
    - cron: "20 8 * * *"   # 08:20 UTC daily; quiet hour for lab announcements
  workflow_dispatch:
    inputs:
      redraft_pending:
        # The API key lives here as an Actions secret and nowhere else, which
        # is the point: secrets are write-only, so no local checkout can read
        # it. A queued candidate that never got a draft therefore has to be
        # redrafted from inside a run. Off by default so the nightly cron
        # never re-bills the queue on its own.
        description: "Also retry drafting for queued candidates that have none"
        type: boolean
        default: false

jobs:
  detect:
    runs-on: ubuntu-latest
    # Dormant until Walker sets the repository variable NIGHTLY_ENABLED=true
    # on his launch checklist. The job-level gate covers both cron and
    # manual dispatch.
    if: vars.NIGHTLY_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Configure git identity
        # Before any merge: a non-fast-forward merge creates a commit and
        # dies without identity (P6 review R1).
        run: |
          git config user.name "versioncontrol-nightly"
          git config user.email "nightly@users.noreply.github.com"

      - name: Sync the rolling pending branch
        run: |
          git checkout -B nightly-pending origin/main
          if git ls-remote --exit-code origin nightly-pending >/dev/null 2>&1; then
            git fetch origin nightly-pending
            # Only the branch-absent first night is tolerated (the guard
            # above); a real merge failure here must fail the run loudly.
            git merge --no-edit FETCH_HEAD
          fi

      - name: Detect, correlate, extract, write pending
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDRAFT: ${{ inputs.redraft_pending }}
        run: |
          # inputs is empty on a schedule event, so REDRAFT is "" and the
          # nightly cron keeps its normal single-pass behaviour.
          args=""
          if [ "$REDRAFT" = "true" ]; then
            args="--redraft-pending"
          fi
          python -m pipeline.nightly --report-path morning_report.md $args

      - name: Upload morning report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-report
          path: morning_report.md

      - name: Commit candidates and ledger to the pending branch
        # Runs even when detection failed so recorded LLM spend and written
        # candidates are never discarded with the runner (P6 review R2/R3);
        # the job still goes red on failure, this step only preserves state.
        if: always()
        run: |
          # Never complete a conflicted merge with candidate files full of
          # conflict markers: bail and leave the red run for human eyes.
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Merge in progress after a conflict; not committing."
            exit 0
          fi
          mkdir -p data/pending
          git add -A -- data/pending
          if [ -f data/derived/llm_ledger.json ]; then
            git add data/derived/llm_ledger.json
          fi
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "nightly: candidate releases awaiting review $(date -u +%F)"
          # One retry. Run 36585744246 (2026-09-29) lost the night to a single
          # "remote rejected ... (Internal Server Error)"; Sonnet 5.5 survived
          # only because it was still inside the lookback the next night. A
          # retry first takes anything pushed meanwhile (a promote run); a
          # conflicted merge fails here, red, rather than being forced.
          if ! git push origin nightly-pending; then
            echo "Push failed; fetching, merging and retrying once."
            sleep 15
            if git ls-remote --exit-code origin nightly-pending >/dev/null 2>&1; then
              git fetch origin nightly-pending
              git merge --no-edit FETCH_HEAD
            fi
            git push origin nightly-pending
          fi

      - name: Open or refresh the review PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code origin nightly-pending >/dev/null 2>&1; then
            exit 0
          fi
          existing=$(gh pr list --head nightly-pending --state open \
                     --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            if [ -f morning_report.md ]; then
              gh pr edit "$existing" --body-file morning_report.md
            fi
          elif ! git diff --quiet origin/main origin/nightly-pending -- data/pending; then
            # A repo whose Actions cannot open PRs fails here with a raw
            # GraphQL error that reads like a code bug. It is a settings
            # checkbox, so say so: the candidates are already safe on the
            # branch and only the review PR is missing.
            if ! gh pr create --base main --head nightly-pending \
                 --title "Pending release candidates" \
                 --body-file morning_report.md 2>pr_error.txt; then
              cat pr_error.txt
              if grep -q "not permitted to create or approve pull requests" pr_error.txt; then
                echo "::error::Candidates are committed to nightly-pending, but"\
                     "Actions cannot open the review PR. Enable Settings ->"\
                     "Actions -> General -> Workflow permissions -> 'Allow"\
                     "GitHub Actions to create and approve pull requests'."
              fi
              exit 1
            fi
          fi

  ci:
    # The bot's push triggers no CI, so run it here on what was just pushed.
    needs: detect
    if: needs.detect.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: nightly-pending

  ci-status:
    # Show the result on the review PR's head commit, where a person looks.
    needs: [detect, ci]
    if: always() && needs.detect.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post the CI result to the nightly-pending head commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.ci.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha=$(gh api "repos/$REPO/commits/nightly-pending" --jq .sha)
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          desc="tests, validation and browser checks: $RESULT"
          gh api -X POST "repos/$REPO/statuses/$sha" -f state="$state" -f context="ci (nightly-pending)" -f target_url="$RUN_URL" -f description="$desc"
