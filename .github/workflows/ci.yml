name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest pipeline/tests -q
      - name: Manifest-drift guard
        run: python -c "from pipeline import store; problems = store.check_manifest(); assert not problems, problems"
      - name: Record validation (every entry, ids, predecessors)
        run: python -m pipeline.validate
      - name: Story-drift guard
        # Every figure on the story page is read from data/ at build time, so
        # a refreshed capture silently falsifies it unless a rebuild is forced.
        run: python -m pipeline.build_story --check
