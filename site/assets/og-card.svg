<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Version Control: the release record of the model era">
  <!-- Version Control OG card. A PNG render of this file ships as assets/og.png
       in a later phase; the meta tags already reference that path. -->
  <style>
    .slab { font-family: Rockwell, "Rockwell Nova", "Roboto Slab", "DejaVu Serif", Georgia, serif; }
    .body { font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
  </style>

  <rect width="1200" height="630" fill="#f1f3e9"/>

  <!-- ledger head: Scotch rule, thick over thin -->
  <rect x="90" y="150" width="1020" height="6" fill="#1d211a"/>
  <rect x="90" y="162" width="1020" height="2" fill="#1d211a"/>

  <text x="90" y="292" class="slab" font-size="96" font-weight="700" fill="#1d211a">Version Control</text>
  <text x="92" y="356" class="slab" font-size="34" font-style="italic" fill="#57604e">The release record of the model era.</text>

  <!-- a provenance-tagged measurement with its delta chip: the house mark -->
  <text x="92" y="468" class="mono" font-size="34" fill="#1d211a">80.7</text>
  <rect x="184" y="438" width="62" height="34" fill="none" stroke="#1d211a" stroke-width="2" rx="4"/>
  <text x="215" y="463" text-anchor="middle" class="mono" font-size="20" letter-spacing="2" fill="#1d211a">IND</text>
  <rect x="278" y="434" width="332" height="42" fill="#e7ebd8" stroke="#dde1cd" stroke-width="2" rx="6"/>
  <text x="298" y="463" class="mono" font-size="24" font-weight="600" fill="#1d211a">+7.5</text>
  <text x="368" y="463" class="body" font-size="22" fill="#57604e">vs predecessor</text>
  <rect x="536" y="440" width="58" height="30" fill="none" stroke="#1d211a" stroke-width="2" rx="4"/>
  <text x="565" y="462" text-anchor="middle" class="mono" font-size="18" letter-spacing="2" fill="#1d211a">IND</text>

  <text x="92" y="556" class="body" font-size="24" fill="#57604e">Every number tells you where it came from, or it does not appear.</text>
</svg>
