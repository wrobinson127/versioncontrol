<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Specimen release entry card showing every state the registry can render">
  <!-- Version Control: static signature poster.
       A rendered SPECIMEN entry card. All content is labeled specimen content.
       It deliberately shows one delta chip, one refused comparison in words,
       and two NOT_DISCLOSED outline marks, so every state is visible today.
       Doubles as the timeline loading state. -->
  <style>
    .slab { font-family: Rockwell, "Rockwell Nova", "Roboto Slab", "DejaVu Serif", Georgia, serif; }
    .body { font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
  </style>

  <rect width="720" height="470" fill="#f1f3e9"/>

  <!-- the card -->
  <rect x="20" y="20" width="680" height="430" rx="6" fill="#f8f9f1" stroke="#dde1cd"/>

  <!-- specimen stamp -->
  <rect x="556" y="40" width="116" height="28" fill="none" stroke="#57604e" stroke-dasharray="4 3" rx="2"/>
  <text x="614" y="59" text-anchor="middle" class="mono" font-size="12" letter-spacing="2.5" fill="#57604e">SPECIMEN</text>

  <!-- head row -->
  <text x="44" y="62" class="mono" font-size="13" fill="#1d211a">2030-01-15</text>
  <text x="142" y="62" class="body" font-size="13" font-weight="600" fill="#57604e">Specimen Lab</text>
  <text x="252" y="62" class="body" font-size="13" fill="#6b7361">release</text>

  <!-- model name -->
  <text x="44" y="106" class="slab" font-size="28" font-weight="700" fill="#1d211a">Specimen Model 3</text>

  <!-- summary -->
  <text x="44" y="136" class="body" font-size="13.5" fill="#1d211a">Specimen Lab released Specimen Model 3, available by public API. This card is a</text>
  <text x="44" y="156" class="body" font-size="13.5" fill="#1d211a">specimen: it renders every state the record can contain, including the marks below.</text>

  <!-- facts row: availability, parameters (NOT_DISCLOSED outline mark) -->
  <text x="44" y="188" class="body" font-size="12.5" fill="#57604e">availability:</text>
  <text x="122" y="188" class="mono" font-size="12" fill="#1d211a">public API</text>
  <text x="216" y="188" class="body" font-size="12.5" fill="#57604e">parameters:</text>
  <rect x="290" y="174" width="92" height="19" fill="none" stroke="#6b7361" stroke-dasharray="3 2" rx="2"/>
  <text x="336" y="187.5" text-anchor="middle" class="body" font-size="10.5" letter-spacing="0.5" fill="#57604e">not disclosed</text>

  <line x1="44" y1="212" x2="676" y2="212" stroke="#dde1cd"/>

  <!-- measurement row 1: value, IND tag, delta chip -->
  <text x="44" y="242" class="body" font-size="13.5" font-weight="600" fill="#1d211a">GPQA Diamond</text>
  <text x="210" y="243" class="mono" font-size="15" fill="#1d211a">61.4</text>
  <rect x="252" y="229" width="30" height="15" fill="none" stroke="#1d211a" rx="2"/>
  <text x="267" y="240.5" text-anchor="middle" class="mono" font-size="9" letter-spacing="1" fill="#1d211a">IND</text>
  <rect x="300" y="226" width="178" height="21" fill="#e7ebd8" stroke="#dde1cd" rx="3"/>
  <text x="310" y="241" class="mono" font-size="12" font-weight="600" fill="#1d211a">+2.1</text>
  <text x="346" y="241" class="body" font-size="11" fill="#57604e">vs predecessor</text>
  <rect x="438" y="229" width="30" height="15" fill="none" stroke="#1d211a" rx="2"/>
  <text x="453" y="240.5" text-anchor="middle" class="mono" font-size="9" letter-spacing="1" fill="#1d211a">IND</text>
  <text x="44" y="264" class="mono" font-size="10.5" fill="#6b7361">configuration: specimen-model-3_high</text>

  <!-- measurement row 2: value, LAB tag, refused comparison in words -->
  <text x="44" y="298" class="body" font-size="13.5" font-weight="600" fill="#1d211a">SWE-Bench Verified</text>
  <text x="210" y="299" class="mono" font-size="15" fill="#1d211a">58.0</text>
  <rect x="252" y="285" width="30" height="15" fill="none" stroke="#1d211a" rx="2"/>
  <text x="267" y="296.5" text-anchor="middle" class="mono" font-size="9" letter-spacing="1" fill="#1d211a">LAB</text>
  <text x="300" y="298" class="body" font-size="12.5" font-style="italic" fill="#57604e">no comparable measurement against the predecessor</text>

  <line x1="44" y1="322" x2="676" y2="322" stroke="#dde1cd"/>

  <!-- disclosure row -->
  <text x="44" y="352" class="body" font-size="11.5" fill="#57604e">system card</text>
  <text x="44" y="374" class="body" font-size="12" fill="#2e4a38" text-decoration="underline">link</text>

  <text x="205" y="352" class="body" font-size="11.5" fill="#57604e">model card</text>
  <rect x="205" y="360" width="92" height="19" fill="none" stroke="#6b7361" stroke-dasharray="3 2" rx="2"/>
  <text x="251" y="373.5" text-anchor="middle" class="body" font-size="10.5" letter-spacing="0.5" fill="#57604e">not disclosed</text>

  <text x="366" y="352" class="body" font-size="11.5" fill="#57604e">usage policy</text>
  <text x="366" y="374" class="body" font-size="12" fill="#2e4a38" text-decoration="underline">link</text>

  <text x="527" y="352" class="body" font-size="11.5" fill="#57604e">paper</text>
  <text x="527" y="374" class="body" font-size="12" fill="#2e4a38" text-decoration="underline">link</text>

  <!-- card footer -->
  <text x="44" y="420" class="body" font-size="10.5" fill="#6b7361">This card is a specimen. It renders refusal and non-disclosure so both states are visible before the record loads.</text>
</svg>
